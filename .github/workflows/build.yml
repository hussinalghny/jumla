# JUMLA — بناء التطبيق تلقائياً على GitHub · Developed by GHANI CODE
name: Build JUMLA App
on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart tool/setup.dart
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release --dart-define=API_BASE=https://jumlapp.com/api
      - uses: actions/upload-artifact@v4
        with:
          name: jumla-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart tool/setup.dart
      - run: flutter build ios --release --no-codesign --dart-define=API_BASE=https://jumlapp.com/api
