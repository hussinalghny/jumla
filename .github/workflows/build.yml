# JUMLA — بناء التطبيق تلقائياً على GitHub · Developed by GHANI CODE
name: Build JUMLA App
on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart tool/setup.dart
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: |
          flutter test --reporter expanded > test.log 2>&1 || {
            grep -E "FAILED|Expected|Actual|Which|reason|Exception|Error|\[E\]" test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - run: flutter build apk --release --dart-define=API_BASE=https://jumlapp.com/api
      - uses: actions/upload-artifact@v4
        with:
          name: jumla-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart tool/setup.dart
      - run: flutter build ios --release --no-codesign --dart-define=API_BASE=https://jumlapp.com/api
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry jumla-unsigned.ipa Payload
          ls -lh jumla-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: jumla-ios-ipa
          path: jumla-unsigned.ipa

  release:
    # ينشر آخر نسخة برابط تنزيل ثابت بصفحة Releases
    needs: [android, ios]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv out/app-release.apk out/jumla.apk
          mv out/jumla-unsigned.ipa out/jumla.ipa
          gh release delete app-latest -y --cleanup-tag || true
          gh release create app-latest out/jumla.apk out/jumla.ipa \
            --target "${{ github.sha }}" \
            --title "JUMLA — آخر نسخة" \
            --notes "نسخة تلقائية من آخر تحديث على main. jumla.ipa غير موقّعة (للتوقيع الخارجي). jumla.apk للأندرويد. برمجة وتطوير GHANI CODE."
